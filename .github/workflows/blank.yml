name: Run Canada CDN Proxy
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  run-proxy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Tmate Tunnel (Canada AWS/Azure Node)
      uses: mxschmitt/action-tmate@v3
      with:
        limit-access-to-actor: false
