name: Run Canada CDN Proxy (Auto)
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  run-proxy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install and Start Proxy Server
      run: |
        # 1. Скачиваем стабильный прокси-сервер (FRP)
        wget https://github.com
        tar -xvf frp_0.54.0_linux_amd64.tar.gz
        cd frp_0.54.0_linux_amd64
        
        # 2. Создаем конфигурацию сервера
        echo -e "[common]\nbind_port = 443\nvhost_https_port = 443" > frps.toml
        ./frps -c frps.toml &
        
        # 3. Автоматически определяем канадский IP-адрес машины
        echo "=============================================="
        echo "   ВАШ КАНАДСКИЙ IP АДРЕС ДЛЯ VIRTUAL HOST:   "
        echo "=============================================="
        curl -s ifconfig.me
        echo -e "\n=============================================="
        
        # 4. Держим сервер активным 6 часов (21600 секунд) без отключений
        sleep 21600
